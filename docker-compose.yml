services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=contacts
      - DB_USER=laminas
      - DB_PASSWORD=laminas_secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mezzio-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contacts
      POSTGRES_USER: laminas
      POSTGRES_PASSWORD: laminas_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laminas -d contacts"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mezzio-network

volumes:
  postgres_data:

networks:
  mezzio-network:
    driver: bridge
